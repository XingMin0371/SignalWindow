name: signal-window

services:
  window:
    build:
      context: ..
    image: signal-window:local
    container_name: signal-window
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?请在 .env 中设置 GATEWAY_TOKEN}
      PORT: "8787"
      DATA_DIR: /app/data
      UPSTREAMS_FILE: /app/config/upstreams.json
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - window-data:/app/data
      - ../config:/app/config
    security_opt:
      - no-new-privileges:true

  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    container_name: signal-window-caddy
    restart: unless-stopped
    depends_on:
      - window
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  window-data:
  caddy-data:
  caddy-config:
